[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p24grasp"
version = "0.2.0"
description = "P24 prosthetic hand grasp: MuJoCo simulation, geometric/PyRoki IK, RL policies, desktop and web viewers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "mujoco>=3.12.0",
    "matplotlib",
    "pillow",
]

[project.optional-dependencies]
rl = [
    "gymnasium==1.1.1",
    "stable-baselines3==2.6.0",
    "tensorboard",
    "imageio",
    "imageio-ffmpeg",
]
web = ["viser"]
test = ["pytest"]

# torch is deliberately NOT declared here.  On macOS with conda-forge, pip's
# torch wheel bundles its own libomp and collides with conda's llvm-openmp:
#   OMP: Error #15: Initializing libomp.dylib, ...
# Install torch from conda-forge instead:
#   conda install -c conda-forge pytorch

[project.scripts]
p24-viewer = "p24grasp.viewers.desktop:main"
p24-web = "p24grasp.viewers.web:main"
p24-demo = "p24grasp.sim.demo:main"
p24-train = "p24grasp.rl.train:main"
p24-eval = "p24grasp.rl.eval:main"
p24-pyroki = "p24grasp.pyroki.ik:main"
p24-build = "p24grasp.model.mjcf:main"

[tool.setuptools.packages.find]
include = ["p24grasp*"]

[tool.setuptools.package-data]
p24grasp = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
# 研究代码的务实 lint 门槛：关闭与可维护性无关/易误报的检查，
# 保留真正的错误与警告（undefined-variable 等）
[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-instance-attributes",
    "too-many-branches",
    "too-many-statements",
    "invalid-name",
    "fixme",
    "line-too-long",
    "broad-exception-caught",
    "duplicate-code",
    "import-error",           # 可选依赖（torch/SB3/viser/pyroki）
    "no-member",              # numpy/mujoco 的动态成员误报
    "no-name-in-module",
    "redefined-outer-name",   # pytest fixture 惯用法
    "global-statement",
    "unused-argument",
    "consider-using-f-string",
    "unnecessary-lambda",
    "protected-access",
    "attribute-defined-outside-init",
    "used-before-assignment",
    "wrong-import-position",   # 测试文件先加 sys.path 再导入的引导模式
    "import-outside-toplevel", # 惰性导入（打破可选依赖环）是刻意设计
    "cyclic-import",           # paths <-> mjcf 的循环由惰性导入在运行时断开
]

[tool.pylint.format]
max-line-length = 100
